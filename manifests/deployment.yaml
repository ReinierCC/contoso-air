apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  labels:
    app: my-app
    kubernetes.azure.com/generator: devhub
  namespace: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app
          image: reiacr9.azurecr.io/myimage:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
