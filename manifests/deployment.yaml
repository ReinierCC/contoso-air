apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  labels:
    app: my-app
    kubernetes.azure.com/generator: devhub
  namespace: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app
          image: contoso-air:385dfd096e56bafeea611cd4171535978b74ba3c
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
